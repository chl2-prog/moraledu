<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地球清潔大作戰</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: linear-gradient(#b9e8ff, #eefaff);
      color: #17324d;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 950px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 36px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 18px;
      color: #47647b;
    }

    .mode-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { transform: translateY(-2px); }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .mode-btn {
      background: white;
      border: 2px solid #1a8cff;
      color: #176fc0;
    }

    .mode-btn.active {
      background: #1a8cff;
      color: white;
    }

    .info-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .info-box {
      background: white;
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.1);
    }

    .info-title {
      font-size: 14px;
      color: #678094;
    }

    .info-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 3px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 560px;
      border-radius: 25px;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          #9ce2ff 0%,
          #d9f4ff 65%,
          #8ad77d 65%,
          #69bd62 100%
        );
      border: 5px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,.16);
      user-select: none;
    }

    .cloud {
      position: absolute;
      font-size: 65px;
      opacity: .8;
      pointer-events: none;
    }

    .cloud1 { left: 4%; top: 5%; }
    .cloud2 { right: 6%; top: 10%; }

    .instruction {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.92);
      padding: 9px 18px;
      border-radius: 30px;
      z-index: 50;
      font-weight: bold;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .earth {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      left: 50%;
      top: 51%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background:
        radial-gradient(circle at 32% 28%, #79d7ff, #2b9ce4 58%, #0864a8);
      box-shadow:
        inset -25px -20px 35px rgba(0,0,0,.18),
        0 8px 20px rgba(0,0,0,.25);
      border: 6px solid rgba(255,255,255,.6);
    }

    .land {
      position: absolute;
      background: #62b84d;
      border-radius: 45% 60% 50% 55%;
    }

    .land1 {
      width: 105px; height: 85px;
      top: 60px; left: 43px;
      transform: rotate(-18deg);
    }

    .land2 {
      width: 77px; height: 120px;
      top: 150px; left: 100px;
      transform: rotate(17deg);
    }

    .land3 {
      width: 120px; height: 85px;
      top: 75px; right: 25px;
      transform: rotate(12deg);
    }

    .land4 {
      width: 83px; height: 93px;
      right: 60px; bottom: 42px;
      transform: rotate(-22deg);
    }

    .person {
      position: absolute;
      font-size: 38px;
      z-index: 3;
      pointer-events: none;
    }

    .person1 { left: 75px; top: 105px; }
    .person2 { right: 80px; top: 150px; }
    .person3 { left: 155px; bottom: 55px; }

    #trashLayer {
      position: absolute;
      inset: 0;
      z-index: 20;
    }

    .trash {
      position: absolute;
      width: 58px;
      height: 58px;
      background: rgba(255,255,255,.95);
      border: 3px solid white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 4px 9px rgba(0,0,0,.18);
    }

    .trash:active { cursor: grabbing; }

    .trash.selected {
      outline: 5px solid #ffcf33;
      transform: scale(1.12);
    }

    #trashBin {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 110px;
      height: 115px;
      border: 4px dashed rgba(255,255,255,.9);
      background: rgba(255,255,255,.93);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
      cursor: pointer;
      transition: .15s;
    }

    #trashBin .icon { font-size: 55px; }
    #trashBin span { font-weight: bold; font-size: 15px; }

    #trashBin.highlight {
      transform: scale(1.08);
      background: #fff1a8;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    #startBtn {
      background: #24aa63;
      color: white;
      min-width: 180px;
    }

    #resetBtn,
    #soundBtn {
      background: #f1f4f7;
      color: #365169;
    }

    .battle-board {
      display: none;
      margin-top: 15px;
      background: white;
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .battle-board.show { display: block; }

    .battle-score-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
    }

    .battle-player { min-width: 110px; }

    .battle-player strong {
      font-size: 27px;
      display: block;
      margin-top: 4px;
    }

    .result {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: #fff8cc;
      border: 3px solid #ffda52;
      border-radius: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .result.show { display: block; }

    .timer-warning {
      color: #e62828;
      animation: flash .5s infinite alternate;
    }

    @keyframes flash {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    @media (max-width: 600px) {
      body { padding: 8px; }
      h1 { font-size: 27px; }

      #gameArea { height: 520px; }

      .earth {
        width: 280px;
        height: 280px;
      }

      .land1 { width: 85px; height: 70px; }
      .land2 {
        width: 60px; height: 90px;
        left: 80px; top: 125px;
      }
      .land3 { width: 95px; height: 68px; }
      .land4 { width: 65px; height: 70px; }

      .person { font-size: 30px; }
      .person1 { left: 58px; top: 87px; }
      .person2 { right: 55px; top: 120px; }
      .person3 { left: 120px; bottom: 42px; }

      #trashBin {
        width: 88px;
        height: 95px;
        right: 10px;
        bottom: 10px;
      }

      #trashBin .icon { font-size: 43px; }

      .trash {
        width: 52px;
        height: 52px;
        font-size: 31px;
      }
    }
  </style>
</head>

<body>

<div class="game-container">

  <h1>🌍 地球清潔大作戰</h1>

  <div class="subtitle">
    30秒內將垃圾放入垃圾桶，睇下你可以清理幾多件！
  </div>

  <div class="mode-buttons">
    <button id="singleMode" class="mode-btn active">👤 單人模式</button>
    <button id="battleMode" class="mode-btn">🏆 比賽模式</button>
  </div>

  <div class="info-bar">
    <div class="info-box">
      <div class="info-title">玩家</div>
      <div class="info-number" id="playerDisplay">玩家 1</div>
    </div>

    <div class="info-box">
      <div class="info-title">剩餘時間</div>
      <div class="info-number" id="timer">30</div>
    </div>

    <div class="info-box">
      <div class="info-title">分數</div>
      <div class="info-number" id="score">0</div>
    </div>
  </div>

  <div id="gameArea">

    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>

    <div class="instruction" id="instruction">
      按「開始遊戲」開始
    </div>

    <div class="earth">
      <div class="land land1"></div>
      <div class="land land2"></div>
      <div class="land land3"></div>
      <div class="land land4"></div>

      <div class="person person1">🧒</div>
      <div class="person person2">👧</div>
      <div class="person person3">🧑</div>
    </div>

    <div id="trashLayer"></div>

    <div id="trashBin" role="button" tabindex="0">
      <div class="icon">🗑️</div>
      <span>垃圾桶</span>
    </div>

  </div>

  <div class="controls">
    <button id="startBtn">▶️ 開始遊戲</button>
    <button id="resetBtn">🔄 重新開始</button>
    <button id="soundBtn">🔊 音效：開</button>
  </div>

  <div class="battle-board" id="battleBoard">
    <div class="battle-score-row">
      <div class="battle-player">
        玩家 1
        <strong id="player1Score">—</strong>
      </div>

      <div>VS</div>

      <div class="battle-player">
        玩家 2
        <strong id="player2Score">—</strong>
      </div>
    </div>
  </div>

  <div class="result" id="result"></div>

</div>

<script>
  const GAME_TIME = 30;

  const trashIcons = [
    "🥤", "🥫", "🧃", "🗞️", "🍌",
    "🧴", "📦", "🍬", "🥡", "🧻"
  ];

  const gameArea = document.getElementById("gameArea");
  const trashLayer = document.getElementById("trashLayer");
  const trashBin = document.getElementById("trashBin");
  const timerDisplay = document.getElementById("timer");
  const scoreDisplay = document.getElementById("score");
  const playerDisplay = document.getElementById("playerDisplay");
  const instruction = document.getElementById("instruction");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");
  const soundBtn = document.getElementById("soundBtn");
  const singleModeBtn = document.getElementById("singleMode");
  const battleModeBtn = document.getElementById("battleMode");
  const battleBoard = document.getElementById("battleBoard");
  const player1Score = document.getElementById("player1Score");
  const player2Score = document.getElementById("player2Score");
  const result = document.getElementById("result");

  let gameMode = "single";
  let score = 0;
  let timeLeft = GAME_TIME;
  let currentPlayer = 1;
  let scores = [null, null];
  let gameRunning = false;
  let timerInterval = null;
  let trashSpawnInterval = null;
  let selectedTrash = null;

  /* -------------------------
     音效系統
     不需要任何 MP3 / WAV
  ------------------------- */

  let soundEnabled = true;
  let audioContext = null;

  function getAudioContext() {
    if (!audioContext) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (AudioContextClass) {
        audioContext = new AudioContextClass();
      }
    }

    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }

    return audioContext;
  }

  function playTone(frequency, duration = 0.12, type = "sine", volume = 0.12, delay = 0) {
    if (!soundEnabled) return;

    const ctx = getAudioContext();
    if (!ctx) return;

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    const startTime = ctx.currentTime + delay;
    const endTime = startTime + duration;

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, startTime);

    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, endTime);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(startTime);
    oscillator.stop(endTime + 0.02);
  }

  function playStartSound() {
    playTone(440, 0.10, "sine", 0.10, 0);
    playTone(660, 0.10, "sine", 0.10, 0.12);
    playTone(880, 0.16, "sine", 0.12, 0.24);
  }

  function playCollectSound() {
    playTone(720, 0.07, "sine", 0.10, 0);
    playTone(980, 0.10, "sine", 0.10, 0.07);
  }

  function playCountdownSound() {
    playTone(520, 0.07, "square", 0.06, 0);
  }

  function playFinishSound() {
    playTone(420, 0.13, "triangle", 0.09, 0);
    playTone(330, 0.13, "triangle", 0.09, 0.15);
    playTone(260, 0.22, "triangle", 0.10, 0.30);
  }

  function playWinnerSound() {
    playTone(523.25, 0.12, "sine", 0.10, 0);
    playTone(659.25, 0.12, "sine", 0.10, 0.13);
    playTone(783.99, 0.12, "sine", 0.10, 0.26);
    playTone(1046.5, 0.28, "sine", 0.13, 0.39);
  }

  soundBtn.addEventListener("click", function () {
    soundEnabled = !soundEnabled;

    soundBtn.textContent =
      soundEnabled
        ? "🔊 音效：開"
        : "🔇 音效：關";

    if (soundEnabled) {
      getAudioContext();
      playTone(700, 0.10, "sine", 0.08);
    }
  });

  /* -------------------------
     模式
  ------------------------- */

  singleModeBtn.addEventListener("click", function () {
    if (gameRunning) return;

    gameMode = "single";
    singleModeBtn.classList.add("active");
    battleModeBtn.classList.remove("active");
    battleBoard.classList.remove("show");

    resetGame();
  });

  battleModeBtn.addEventListener("click", function () {
    if (gameRunning) return;

    gameMode = "battle";
    battleModeBtn.classList.add("active");
    singleModeBtn.classList.remove("active");
    battleBoard.classList.add("show");

    resetGame();
  });

  /* -------------------------
     開始
  ------------------------- */

  startBtn.addEventListener("click", function () {
    if (gameRunning) return;

    getAudioContext();

    if (
      gameMode === "battle" &&
      scores[0] !== null &&
      scores[1] !== null
    ) {
      resetGame();
    }

    startRound();
  });

  function startRound() {
    clearTimers();
    clearTrash();

    score = 0;
    timeLeft = GAME_TIME;

    scoreDisplay.textContent = score;
    timerDisplay.textContent = timeLeft;
    timerDisplay.classList.remove("timer-warning");

    gameRunning = true;
    result.classList.remove("show");

    singleModeBtn.disabled = true;
    battleModeBtn.disabled = true;
    startBtn.disabled = true;

    startBtn.textContent = "♻️ 清潔中...";

    playerDisplay.textContent =
      gameMode === "battle"
        ? "玩家 " + currentPlayer
        : "玩家 1";

    instruction.textContent =
      "快啲！將垃圾拖入垃圾桶 🗑️";

    playStartSound();

    for (let i = 0; i < 7; i++) {
      createTrash();
    }

    trashSpawnInterval = setInterval(function () {
      if (trashLayer.children.length < 11) {
        createTrash();
      }
    }, 800);

    timerInterval = setInterval(function () {
      timeLeft--;
      timerDisplay.textContent = timeLeft;

      if (timeLeft <= 5 && timeLeft > 0) {
        timerDisplay.classList.add("timer-warning");
        playCountdownSound();
      }

      if (timeLeft <= 0) {
        endRound();
      }
    }, 1000);
  }

  /* -------------------------
     建立垃圾
  ------------------------- */

  function createTrash() {
    if (!gameRunning) return;

    const trash = document.createElement("div");
    trash.className = "trash";

    trash.textContent =
      trashIcons[
        Math.floor(Math.random() * trashIcons.length)
      ];

    const gameRect = gameArea.getBoundingClientRect();
    const size = 60;

    let x =
      15 +
      Math.random() *
      (gameRect.width - size - 30);

    let y =
      75 +
      Math.random() *
      (gameRect.height - size - 150);

    if (
      x > gameRect.width - 150 &&
      y > gameRect.height - 180
    ) {
      x -= 150;
    }

    trash.style.left = x + "px";
    trash.style.top = y + "px";

    trashLayer.appendChild(trash);
    makeTrashDraggable(trash);
  }

  /* -------------------------
     拖動垃圾
  ------------------------- */

  function makeTrashDraggable(trash) {
    let dragging = false;
    let pointerId = null;
    let offsetX = 0;
    let offsetY = 0;

    trash.addEventListener("pointerdown", function (event) {
      if (!gameRunning) return;

      dragging = true;
      pointerId = event.pointerId;

      const rect = trash.getBoundingClientRect();

      offsetX = event.clientX - rect.left;
      offsetY = event.clientY - rect.top;

      trash.setPointerCapture(pointerId);

      selectTrash(trash);
    });

    trash.addEventListener("pointermove", function (event) {
      if (
        !dragging ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      const areaRect = gameArea.getBoundingClientRect();

      let newX =
        event.clientX -
        areaRect.left -
        offsetX;

      let newY =
        event.clientY -
        areaRect.top -
        offsetY;

      newX = Math.max(
        0,
        Math.min(
          areaRect.width - trash.offsetWidth,
          newX
        )
      );

      newY = Math.max(
        0,
        Math.min(
          areaRect.height - trash.offsetHeight,
          newY
        )
      );

      trash.style.left = newX + "px";
      trash.style.top = newY + "px";

      checkBinHover(trash);
    });

    trash.addEventListener("pointerup", function (event) {
      if (!dragging) return;

      dragging = false;

      trashBin.classList.remove("highlight");

      if (isInsideBin(trash)) {
        collectTrash(trash);
      }

      try {
        trash.releasePointerCapture(event.pointerId);
      } catch (error) {}
    });

    trash.addEventListener("click", function () {
      if (gameRunning) {
        selectTrash(trash);
      }
    });
  }

  function selectTrash(trash) {
    if (selectedTrash) {
      selectedTrash.classList.remove("selected");
    }

    selectedTrash = trash;
    trash.classList.add("selected");
  }

  function checkBinHover(trash) {
    if (isInsideBin(trash)) {
      trashBin.classList.add("highlight");
    } else {
      trashBin.classList.remove("highlight");
    }
  }

  function isInsideBin(trash) {
    const trashRect = trash.getBoundingClientRect();
    const binRect = trashBin.getBoundingClientRect();

    const centerX =
      trashRect.left +
      trashRect.width / 2;

    const centerY =
      trashRect.top +
      trashRect.height / 2;

    return (
      centerX >= binRect.left &&
      centerX <= binRect.right &&
      centerY >= binRect.top &&
      centerY <= binRect.bottom
    );
  }

  trashBin.addEventListener("click", function () {
    if (
      gameRunning &&
      selectedTrash
    ) {
      collectTrash(selectedTrash);
    }
  });

  trashBin.addEventListener("keydown", function (event) {
    if (
      (event.key === "Enter" || event.key === " ") &&
      gameRunning &&
      selectedTrash
    ) {
      event.preventDefault();
      collectTrash(selectedTrash);
    }
  });

  /* -------------------------
     收集垃圾
  ------------------------- */

  function collectTrash(trash) {
    if (!gameRunning || !trash) return;
    if (!trash.isConnected) return;

    trash.remove();
    selectedTrash = null;

    score++;
    scoreDisplay.textContent = score;

    playCollectSound();

    instruction.textContent =
      "✅ 收集成功！ +1";

    if (trashLayer.children.length < 5) {
      createTrash();
      createTrash();
    }

    setTimeout(function () {
      if (gameRunning) {
        instruction.textContent =
          "將垃圾拖入垃圾桶 🗑️";
      }
    }, 350);
  }

  /* -------------------------
     完場
  ------------------------- */

  function endRound() {
    if (!gameRunning) return;

    gameRunning = false;

    clearTimers();
    clearTrash();

    timerDisplay.textContent = "0";
    timerDisplay.classList.remove("timer-warning");

    singleModeBtn.disabled = false;
    battleModeBtn.disabled = false;
    startBtn.disabled = false;

    instruction.textContent = "⏰ 時間到！";

    playFinishSound();

    if (gameMode === "single") {
      let comment;

      if (score >= 25) {
        comment = "🌟 超級環保小英雄！";
      } else if (score >= 15) {
        comment = "👏 做得非常好！";
      } else if (score >= 8) {
        comment = "👍 做得好！繼續努力！";
      } else {
        comment = "💪 再試一次，挑戰更高分！";
      }

      if (score >= 15) {
        setTimeout(playWinnerSound, 600);
      }

      result.innerHTML =
        comment +
        "<br><br>" +
        "你在30秒內收集了 " +
        "<span style='font-size:32px;color:#16a060;'>" +
        score +
        "</span> 件垃圾！";

      result.classList.add("show");

      startBtn.textContent =
        "▶️ 再玩一次";

      return;
    }

    scores[currentPlayer - 1] = score;

    if (currentPlayer === 1) {
      player1Score.textContent = score;

      currentPlayer = 2;

      playerDisplay.textContent =
        "玩家 2";

      instruction.textContent =
        "玩家 1 得 " +
        score +
        " 分！輪到玩家 2！";

      startBtn.textContent =
        "▶️ 玩家 2 開始";

      return;
    }

    player2Score.textContent = score;

    const score1 = scores[0];
    const score2 = scores[1];

    let winner;

    if (score1 > score2) {
      winner = "🏆 玩家 1 勝出！";
    } else if (score2 > score1) {
      winner = "🏆 玩家 2 勝出！";
    } else {
      winner = "🤝 平手！";
    }

    setTimeout(playWinnerSound, 600);

    result.innerHTML =
      winner +
      "<br><br>" +
      "玩家 1：" +
      score1 +
      " 分" +
      "<br>" +
      "玩家 2：" +
      score2 +
      " 分";

    result.classList.add("show");

    startBtn.textContent =
      "🏆 再比一次";
  }

  /* -------------------------
     Reset
  ------------------------- */

  resetBtn.addEventListener(
    "click",
    resetGame
  );

  function resetGame() {
    clearTimers();
    clearTrash();

    gameRunning = false;
    currentPlayer = 1;
    scores = [null, null];
    score = 0;
    timeLeft = GAME_TIME;

    scoreDisplay.textContent = "0";
    timerDisplay.textContent = GAME_TIME;
    timerDisplay.classList.remove("timer-warning");

    playerDisplay.textContent = "玩家 1";

    player1Score.textContent = "—";
    player2Score.textContent = "—";

    result.classList.remove("show");

    instruction.textContent =
      gameMode === "battle"
        ? "玩家 1 準備好就開始！"
        : "按「開始遊戲」開始";

    startBtn.textContent =
      "▶️ 開始遊戲";

    startBtn.disabled = false;
    singleModeBtn.disabled = false;
    battleModeBtn.disabled = false;
  }

  function clearTrash() {
    trashLayer.innerHTML = "";
    selectedTrash = null;
  }

  function clearTimers() {
    clearInterval(timerInterval);
    clearInterval(trashSpawnInterval);

    timerInterval = null;
    trashSpawnInterval = null;
  }

  resetGame();
</script>

</body>
</html>
